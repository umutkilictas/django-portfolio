{% load static %}
<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>{% block title %}{{ SITE_OWNER }} | Bilgisayar Mühendisi &amp; Python / Django Geliştirici{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ SITE_OWNER }} kişisel portfolyosu. Python, Django, yazılım projeleri, bilgisayar mühendisliği deneyimi ve teknik yetkinlikler.{% endblock %}">
    <meta name="author" content="{{ SITE_OWNER }}">
    
    <!-- Favicon (Minimalist SVG) -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Özel CSS (Tema ve Tasarım) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2.0">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    {% include 'includes/navbar.html' %}

    <!-- Ana İçerik -->
    <main class="flex-shrink-0" id="mainContent">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'includes/footer.html' %}

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- Tema Yönetim Scripti -->
    <script src="{% static 'js/theme.js' %}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
