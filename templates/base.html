{% load static %}
<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Tema, sayfa çizilmeden önce uygulanır (açık/koyu geçişinde "flaş" olmaz) -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('portfolio_theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    
    <title>{% block title %}{{ SITE_OWNER }} | Bilgisayar Mühendisi &amp; Python / Django Geliştirici{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ SITE_OWNER }} kişisel portfolyosu. Python, Django, yazılım projeleri, bilgisayar mühendisliği deneyimi ve teknik yetkinlikler.{% endblock %}">
    <meta name="author" content="{{ SITE_OWNER }}">
    
    <!-- Open Graph / LinkedIn / Facebook Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://umutkilictas.tr">
    <meta property="og:title" content="{% block og_title %}{{ SITE_OWNER }} | Portfolyo & Kişisel Web Sitesi{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ SITE_OWNER }} - Bilgisayar Mühendisi & Python / Django Geliştirici portfolyo ve kişisel web sitesi.{% endblock %}">
    <meta property="og:image" content="{% static 'images/og-image.png' %}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}{{ SITE_OWNER }} | Portfolyo{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ SITE_OWNER }} kişisel portfolyo ve projeler.{% endblock %}">
    <meta name="twitter:image" content="{% static 'images/og-image.png' %}">
    
    <!-- Favicon (Minimalist SVG) -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">

    <!-- Inter yazı tipi (kendi sunucumuzdan, önceden yüklenir) -->
    <link rel="preload" href="{% static 'fonts/inter-latin-var.woff2' %}" as="font" type="font/woff2" crossorigin>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Özel CSS (Tema ve Tasarım) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=4.0">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    {% include 'includes/navbar.html' %}

    <!-- Ana İçerik -->
    <main class="flex-shrink-0" id="mainContent">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'includes/footer.html' %}

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- Tema Yönetim Scripti -->
    <script src="{% static 'js/theme.js' %}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
