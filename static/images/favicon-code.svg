<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Hafif derinlik gradyanı -->
    <linearGradient id="codeBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="codeAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Yuvarlatılmış Köşeli Modern Kare (Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#codeBgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Sol Büyüktür '<' Çizimi -->
  <path d="M 44 44 L 26 64 L 44 84" fill="none" stroke="url(#codeAccentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eğik Çizgi '/' -->
  <line x1="72" y1="40" x2="56" y2="88" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>

  <!-- Sağ Büyüktür '>' Çizimi -->
  <path d="M 84 44 L 102 64 L 84 84" fill="none" stroke="url(#codeAccentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
