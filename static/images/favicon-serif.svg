<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    text {
      font-family: Georgia, "Times New Roman", Cambria, serif;
      font-style: italic;
      font-weight: 700;
      font-size: 54px;
      fill: #0f172a;
    }
    .dot {
      fill: #38bdf8;
      font-style: normal;
    }

    @media (prefers-color-scheme: dark) {
      text {
        fill: #f8fafc;
      }
    }
  </style>

  <!-- Kutu yok: Edebi, entelektüel İtalik Serif u. -->
  <text x="12" y="48">u<tspan class="dot">.</tspan></text>
</svg>
